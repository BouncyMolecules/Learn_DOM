<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn DOM</title>
    <style>
        .div-highlight {
            border: 2px solid teal;
            padding: 8px;
        }
    </style>
</head>
<body>
    <h1 id="pageTitle">Welcome to the DOM</h1>
    <div id="myDiv">This is a div.</div>
    <button type="button" id="updateDivBtn">Update div</button>

    <ul id="myList">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <label for="listItemText">List item text:</label>
    <input type="text" id="listItemText">
    <button type="button" id="addItemBtn">Add item</button>
    <button type="button" id="changeItemBtn">Change first item</button>
    <button type="button" id="listDemoBtn">Add demo item</button>

    <h2>Button property demo</h2>
    <button type="button" id="demoButton">Click me to disable</button>
    <button type="button" id="enableDemoButton">Re-enable demo button</button>

    <table id="myTable" border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Anna</td>
                <td>21</td>
            </tr>
            <tr>
                <td>Ben</td>
                <td>23</td>
            </tr>
        </tbody>
    </table>
    <h2>Table row demo</h2>
    <button type="button" id="addTableRowBtn">Add demo row</button>
    <button type="button" id="deleteTableRowBtn" disabled>Delete demo row</button>

    <form id="myForm">
        <label for="color">Color:</label>
        <select id="color" name="color">
            <option value="red">Red</option>
            <option value="green">Green</option>
            <option value="blue">Blue</option>
        </select>
        <p id="selectOutput" aria-live="polite"></p>
        <br>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <br>

        <input type="radio" id="sizeSmall" name="size" value="small">
        <label for="sizeSmall">Small</label>
        <input type="radio" id="sizeLarge" name="size" value="large">
        <label for="sizeLarge">Large</label>
        <br>

        <input type="checkbox" id="agree" name="agree">
        <label for="agree">I agree</label>
        <br>

        <button type="button" id="submitBtn">Press</button>
        <button type="submit">Show form values</button>
    </form>
    <p id="formOutput" aria-live="polite"></p>

    <h2>Input property demo</h2>
    <label for="demoTextInput">Text input:</label>
    <input type="text" id="demoTextInput" placeholder="Type something" required>
    <label for="demoCheckInput">
        <input type="checkbox" id="demoCheckInput">
        Check me
    </label>
    <button type="button" id="inspectInputBtn">Show input properties</button>
    <button type="button" id="toggleInputBtn">Disable text input</button>
    <p id="inputDemoOutput" aria-live="polite"></p>

    <script src="script.js"></script>
</body>
</html>
